      tap_x: 494
      tap_y: 370
      description: "领取奖励：成长页面-点击右下角全部领取"
      wait_after: 1.5
      timeout: 10.0
      match_threshold: 0.65
      optional: true
      action: click_text
      target_text: "全部领取"
    - scene_id: reward_collect2
      scene_template: reward_collect2.png
      tap_x: 494
      tap_y: 370
      description: "领取奖励：重复点击全部领取直到按钮变灰（最多5次）"
      wait_after: 1.5
      timeout: 10.0
      match_threshold: 0.65
      optional: true
      action: repeat_tap_until_gone
      max_repeats: 5

