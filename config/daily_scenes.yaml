      target_text: "离开"
    - scene_id: hunt_result_confirm
      scene_template: hunt_result_confirm.png
      tap_x: 640
      tap_y: 571
      description: "任务5-领主狩猎：结果页面点击确定"
      wait_after: 2.0
      timeout: 10.0
      match_threshold: 0.65
      optional: false
