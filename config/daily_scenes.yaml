# ==================== 冒险岛每日任务场景配置 ====================
# 
# 任务来源：游戏内"成长" → "每日任务"
# 所有坐标基于 1280x720 基准分辨率
# 场景模板来自视频 daily.MP4 自动提取的关键帧
#
# ⚠️ 注意：当前坐标和模版均为自动提取，需要人工校验
# 标记 [待校验] 的坐标需要手动确认
# 标记 [待截图] 的模版需要手动重新截取
#
# 五个核心日常任务：
#   1. 工会签到
#   2. 通关宝石副本1次
#   3. 赠送1次人气值
#   4. 尝试1次星之力强化
#   5. 参加天空岛领主狩猎
# 任务完成后：领取全部日常奖励

global:
  scenes_dir: templates/daily/scenes/core
  match_threshold: 0.7
  default_wait: 1.5

flows:
  # ==================== 总流程：串联执行全部日常任务 ====================
  daily_all:
    description: "每日任务总流程：依次执行5个核心任务 + 领取奖励"
    loop: false
    max_loops: 1
    actions:
    # ------ 前置：从主界面进入 ------
    - scene_id: main_screen
      scene_template: main_screen.png
      tap_x: 1315
      tap_y: 32
      description: "主界面 → 点击右上角菜单按钮，打开功能面板"
      wait_after: 2.0
      timeout: 15.0
      match_threshold: 0.75
      match_mode: region_feature
      ui_regions:
        - {name: "左上角-人物信息栏", x1: 0, y1: 0, x2: 350, y2: 120, min_edge_density: 0.08}
        - {name: "右上角-工具操作栏", x1: 900, y1: 0, x2: 1280, y2: 120, min_edge_density: 0.08}
        - {name: "左下角-虚拟摇杆", x1: 0, y1: 500, x2: 300, y2: 720, min_edge_density: 0.08}
        - {name: "右下角-技能栏", x1: 800, y1: 500, x2: 1280, y2: 720, min_edge_density: 0.08}
      optional: false

    # ====== 任务1：工会签到 ======
    - scene_id: guild_enter
      scene_template: guild_enter.png
      tap_x: 974
      tap_y: 112
      description: "任务1-工会签到：打开工会界面（自动签到）"
      wait_after: 3.0
      timeout: 10.0
      match_threshold: 0.65
      optional: false

    # ====== 任务2：通关宝石副本1次 ======
    - scene_id: daily_play_enter
      scene_template: daily_play_enter.png
      tap_x: 969
      tap_y: 327
      description: "任务2-宝石副本：打开日常玩法列表"
      wait_after: 2.0
      timeout: 10.0
      match_threshold: 0.65
      optional: false
    - scene_id: gem_dungeon_select
      scene_template: gem_dungeon_select.png
      tap_x: 733
      tap_y: 467
      description: "任务2-宝石副本：选择宝石副本（界面可左右滑动）"
      wait_after: 2.0
      timeout: 10.0
      match_threshold: 0.65
      optional: false
    - scene_id: gem_dungeon_confirm
      scene_template: gem_dungeon_confirm.png
      tap_x: 758
      tap_y: 532
      description: "任务2-宝石副本：确认进入副本"
      wait_after: 2.0
      timeout: 10.0
      match_threshold: 0.65
      optional: false
      action: click_text
      target_text: "入场"
    - scene_id: gem_dungeon_result
      scene_template: gem_dungeon_result.png
      tap_x: 599
      tap_y: 402
      description: "任务2-宝石副本：自动战斗结算-点击返回按钮"
      wait_after: 2.0
      timeout: 60.0
      match_threshold: 0.65
      optional: false

    # ====== 任务3：赠送1次人气值 ======
    - scene_id: social_enter
      scene_template: social_enter.png
      tap_x: 968
      tap_y: 327
      description: "任务3-赠送人气：进入社交入口（菜单需上滑展示）"
      wait_after: 2.0
      timeout: 10.0
      match_threshold: 0.65
      optional: false
    - scene_id: social_page_action1
      scene_template: social_page_action1.png
      tap_x: 479
      tap_y: 406
      description: "任务3-赠送人气：点击搜索按钮，弹出搜索好友弹框"
      wait_after: 1.5
      timeout: 10.0
      match_threshold: 0.65
      optional: false
    - scene_id: social_page_action2
      scene_template: social_page_action2.png
      tap_x: 675
      tap_y: 464
      description: "任务3-赠送人气：搜索好友弹框-点击输入框弹出键盘"
      wait_after: 1.5
      timeout: 10.0
      match_threshold: 0.65
      optional: false
    - scene_id: social_input_name
      scene_template: social_input_name.png
      tap_x: 760
      tap_y: 130
      description: "任务3-赠送人气：输入或粘贴'废都的王'"
      wait_after: 1.5
      timeout: 10.0
      match_threshold: 0.65
      optional: false
      action: input_text
      input_text: "废都的王"
    - scene_id: social_open
      scene_template: social_open.png
      tap_x: 761
      tap_y: 130
      description: "任务3-赠送人气：输入好友名称后点击搜索确认"
      wait_after: 2.0
      timeout: 10.0
      match_threshold: 0.65
      optional: false
    - scene_id: friend_search_btn
      scene_template: friend_search_btn.png
      tap_x: 269
      tap_y: 537
      description: "任务3-赠送人气：个人信息页面-点击左下角按钮弹出人气值礼物弹框"
      wait_after: 1.5
      timeout: 10.0
      match_threshold: 0.65
      optional: false
    - scene_id: friend_search_page
      scene_template: friend_search_page.png
      tap_x: 618
      tap_y: 360
      description: "任务3-赠送人气：人气值礼物弹框-点击选中人气值"
      wait_after: 1.5
      timeout: 10.0
      match_threshold: 0.65
      optional: false
    - scene_id: friend_input_name
      scene_template: friend_input_name.png
      tap_x: 666
      tap_y: 363
      description: "任务3-赠送人气：点击确定赠送人气值"
      wait_after: 1.5
      timeout: 10.0
      match_threshold: 0.65
      optional: false
      action: click_text
      target_text: "确定"
    - scene_id: friend_search_confirm
      scene_template: friend_search_confirm.png
      tap_x: 1133
      tap_y: 41
      description: "任务3-赠送人气：点击右上角关闭按钮，关闭个人主页"
      wait_after: 1.5
      timeout: 10.0
      match_threshold: 0.65
      optional: false

    # ====== 任务4：尝试1次星之力强化 ======
    - scene_id: starforce_enter1
      scene_template: starforce_enter1.png
      tap_x: 820
      tap_y: 331
      description: "任务4-星之力强化：设置页面-点击铁匠铺入口"
      wait_after: 1.5
      timeout: 10.0
      match_threshold: 0.65
      optional: false
    - scene_id: starforce_enter2
      scene_template: starforce_enter2.png
      tap_x: 379
      tap_y: 233
      description: "任务4-星之力强化：弹出菜单中选择星之力强化"
      wait_after: 2.0
      timeout: 10.0
      match_threshold: 0.65
      optional: false
    - scene_id: starforce_select_equip
      scene_template: starforce_select_equip.png
      tap_x: 931
      tap_y: 389
      description: "任务4-星之力强化：铁匠铺装备栏-选择装备（优先级：蓝色>紫色>橙色边框）"
      wait_after: 1.5
      timeout: 10.0
      match_threshold: 0.65
      optional: false
      action: select_equip_by_color
      equip_area: {x1: 713, y1: 161, x2: 1150, y2: 618}
      color_priority: ["blue", "purple", "orange"]
    - scene_id: starforce_enhance
      scene_template: starforce_enhance.png
      tap_x: 640
