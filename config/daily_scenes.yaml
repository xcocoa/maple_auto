      target_text: "入场"
    - scene_id: hunt_close_bag
      scene_template: hunt_close_bag.png
      tap_x: 380
      tap_y: 75
      description: "任务5-领主狩猎：入场后收起行囊精灵背包界面"
      wait_after: 2.0
      timeout: 10.0
      match_threshold: 0.65
      optional: false
    - scene_id: hunt_exit_scene
      scene_template: hunt_exit_scene.png
      tap_x: 1124
      tap_y: 283
