# 工会签到流程
# 前置: 角色在主界面
# 路径: 菜单 → 公会（进入即完成签到） → 关闭
#
name: daily_tasks
display_name: 工会签到
timeout: 60
max_retries: 2
step_delay: 1.5

steps:
  - id: open_menu
    description: "打开菜单≡"
    action:
      type: tap
      x: 1195
      y: 15
    delay: 1.5
    on_fail: retry

  - id: click_guild
    description: "OCR识别并点击公会"
    action:
      type: ocr_tap
      text: "公会"
    verify:
      change: false
    delay: 1.5
    on_fail: retry

  - id: close_guild
    description: "关闭工会面板"
    action:
      type: tap
      x: 1122
      y: 32
    delay: 1.0
    on_fail: skip

scenes: {}
targets: {}
