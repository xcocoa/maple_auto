# 工会签到流程
# 前置: 角色在主界面
# 路径: 菜单 → 公会（进入即完成签到） → 关闭
#
# 已验证坐标 (2026-05-07):
#   菜单≡: (1195, 15)
#   公会:  (930, 250)
#   关闭X: (1122, 32)
#
name: daily_tasks
display_name: 工会签到
timeout: 60
max_retries: 2
step_delay: 3.0

steps:
  - id: open_menu
    description: "打开菜单≡"
    action:
      type: tap
      x: 1195
      y: 15
    delay: 3.0
    on_fail: retry

  - id: click_guild
    description: "点击公会入口（进入即签到）"
    action:
      type: tap
      x: 930
      y: 250
    delay: 3.0
    on_fail: retry

  - id: close_guild
    description: "关闭工会面板"
    action:
      type: tap
      x: 1122
      y: 32
    delay: 2.0
    on_fail: skip

scenes: {}
targets: {}
