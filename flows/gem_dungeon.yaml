# 宝石副本流程
# 前置: 角色在主界面
# 路径: 菜单 → 成长 → 滑动 → 立即前往 → 选超难 → 入场 → 确认 → 等待战斗 → 结算 → 关闭回主界面
#
# 坐标来源: getevent 真机验证 (2026-05-09)
#
name: gem_dungeon
display_name: 宝石副本
timeout: 180
max_retries: 1
step_delay: 1.0

steps:
  - id: open_menu
    description: "打开菜单≡"
    action:
      type: tap
      x: 1195
      y: 15
    delay: 1.5
    on_fail: retry

  - id: click_growth
    description: "点击成长"
    action:
      type: tap
      x: 1109
      y: 108
    delay: 1.5
    on_fail: retry

  - id: scroll_find_gem
    description: "滑动成长面板找到宝石副本任务"
    action:
      type: swipe
      x: 640
      y: 400
    delay: 1.0
    on_fail: skip

  - id: click_goto_gem
    description: "点击立即前往"
    action:
      type: tap
      x: 664
      y: 322
    delay: 1.5
    on_fail: retry

  - id: select_difficulty
    description: "选择超难难度"
    action:
      type: tap
      x: 225
      y: 376
    delay: 1.0
    on_fail: retry

  - id: click_enter
    description: "点击入场按钮"
    action:
      type: tap
      x: 1042
      y: 534
    delay: 1.5
    on_fail: retry

  - id: confirm_enter
    description: "确认入场弹框"
    action:
      type: tap
      x: 757
      y: 425
    delay: 1.5
    on_fail: retry

  - id: wait_battle
    description: "等待自动战斗结束（60秒）"
    action:
      type: wait
    delay: 60.0
    on_fail: skip

  - id: click_result
    description: "点击结算页面"
    action:
      type: tap
      x: 640
      y: 300
    delay: 1.5
    on_fail: skip

  - id: close_result
    description: "关闭结算回到主界面"
    action:
      type: tap
      x: 1122
      y: 32
    delay: 1.0
    on_fail: skip

scenes: {}
targets: {}
