# 星之力强化流程
# 前置: 角色在主界面
# 路径: 菜单 → 铁匠铺 → 星之力强化 → 选装备 → 强化 → 确认 → 关闭
#
# 坐标待真机验证
#
name: starforce_enhance
display_name: 星之力强化
timeout: 60
max_retries: 1
step_delay: 2.0

steps:
  - id: open_menu
    description: "打开菜单≡"
    action:
      type: tap
      x: 1195
      y: 15
    delay: 3.0
    on_fail: retry

  - id: click_blacksmith
    description: "点击铁匠铺"
    action:
      type: tap
      x: 1011
      y: 259
    delay: 3.0
    on_fail: retry

  - id: click_starforce
    description: "选择星之力强化"
    action:
      type: tap
      x: 381
      y: 191
    delay: 2.0
    on_fail: retry

  - id: select_equip
    description: "选择一件装备"
    action:
      type: tap
      x: 1100
      y: 443
    delay: 2.0
    on_fail: skip

  - id: click_enhance
    description: "点击强化按钮"
    action:
      type: tap
      x: 640
      y: 534
    delay: 3.0
    on_fail: skip

  - id: confirm_result
    description: "强化结果-点击确认"
    action:
      type: tap
      x: 629
      y: 514
    delay: 2.0
    on_fail: skip

  - id: close_blacksmith
    description: "关闭铁匠铺"
    action:
      type: tap
      x: 1120
      y: 25
    delay: 1.0
    on_fail: skip

scenes: {}
targets: {}
