# 每日签到流程 - 活动面板内的详细签到操作
# 前置条件: 角色在主界面（非菜单内）
# ScaledADB: base_w=1280, base_h=0 (自适应=575)
# 设备: ZY22LJC9ST (2712x1220)
#
name: daily_sign_in
display_name: 每日签到
timeout: 120
max_retries: 1
step_delay: 2.5

steps:
  # ===== 停止挂机 =====
  - id: stop_auto_battle
    description: "停止自动战斗"
    action:
      type: tap
      x: 819
      y: 542
    delay: 3.0
    on_fail: skip

  # ===== 打开菜单 =====
  - id: open_menu
    description: "点击右上角菜单≡"
    action:
      type: tap
      x: 1195
      y: 15
    delay: 3.0
    on_fail: retry

  # ===== 点击活动 =====
  - id: click_activity
    description: "点击菜单中的活动图标"
    action:
      type: tap
      x: 1210
      y: 295
    delay: 3.0
    on_fail: retry

  # ===== 点击签到礼标签 =====
  - id: click_sign_tab
    description: "点击左侧签到礼标签"
    action:
      type: tap
      x: 212
      y: 175
    delay: 2.0
    on_fail: retry

  # ===== 点击每日签到领整月好礼 =====
  - id: click_daily_reward
    description: "点击'每日签到领整月好礼'入口"
    action:
      type: tap
      x: 362
      y: 216
    delay: 2.0
    on_fail: skip

  # ===== 领取奖励 =====
  - id: collect_reward
    description: "领取今日签到奖励"
    action:
      type: tap
      x: 373
      y: 309
    delay: 2.0
    on_fail: skip

  # ===== 关闭活动面板 =====
  - id: close_activity
    description: "关闭活动面板"
    action:
      type: tap
      x: 1122
      y: 32
    delay: 2.0
    on_fail: skip

  # ===== 恢复挂机 =====
  - id: resume_auto_battle
    description: "恢复自动战斗"
    action:
      type: tap
      x: 465
      y: 522
    delay: 0.5
    on_fail: skip

scenes: {}
targets: {}
