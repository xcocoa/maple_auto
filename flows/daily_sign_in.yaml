# 每日签到流程 - 首次真机运行版（纯坐标模式）
# 不依赖场景模板验证，纯靠坐标点击 + 时间等待
# 跑通后会用 recorder 录制真实模板替换
name: daily_sign_in
display_name: 每日签到
timeout: 90
max_retries: 1

steps:
  # ===== 关闭可能的弹窗 =====
  - id: close_popup
    description: "关闭可能出现的弹窗（点击右上角X）"
    action:
      type: tap
      x: 1230
      y: 30
    on_fail: skip

  # ===== 等一下让弹窗关闭 =====
  - id: wait_after_close
    description: "等待画面稳定"
    action:
      type: tap
      x: 640
      y: 360
    on_fail: skip

  # ===== 打开右上角菜单 =====
  - id: open_menu
    description: "点击右上角菜单按钮"
    action:
      type: tap
      x: 1194
      y: 28
    on_fail: retry

  # ===== 点击活动图标 =====
  - id: click_activity
    description: "点击菜单中的活动图标"
    action:
      type: tap
      x: 1155
      y: 233
    on_fail: retry

  # ===== 点击签到礼标签 =====
  - id: click_sign_tab
    description: "点击左侧签到礼标签"
    action:
      type: tap
      x: 100
      y: 103
    on_fail: retry

  # ===== 点击环游武陵桃园 =====
  - id: click_huanyou
    description: "点击'和枫小喵一起环游武陵桃园'"
    action:
      type: tap
      x: 722
      y: 103
    on_fail: skip

  # ===== 点击签到按钮 =====
  - id: click_sign
    description: "点击签到按钮"
    action:
      type: tap
      x: 1036
      y: 521
    on_fail: skip

  # ===== 关闭签到地图 =====
  - id: close_huanyou
    description: "关闭环游地图（点X）"
    action:
      type: tap
      x: 1192
      y: 23
    on_fail: skip

  # ===== 点击每日签到领整月好礼 =====
  - id: click_daily_reward
    description: "点击'每日签到领整月好礼'入口"
    action:
      type: tap
      x: 362
      y: 216
    on_fail: skip

  # ===== 领取奖励 =====
  - id: collect_reward
    description: "领取今日签到奖励"
    action:
      type: tap
      x: 373
      y: 309
    on_fail: skip

  # ===== 关闭活动面板 =====
  - id: close_activity
    description: "关闭活动面板"
    action:
      type: tap
      x: 1192
      y: 23
    on_fail: skip

# 无场景验证模式 - 纯坐标 + 时间等待
scenes: {}
targets: {}
